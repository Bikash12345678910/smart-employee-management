server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: employee-management-backend
  profiles:
    active: mysql

  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Gmail SMTP Configuration for 6-Digit Email OTP
  # Set GMAIL_USERNAME and GMAIL_APP_PASSWORD (16-char Google App Password)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# App JWT & OTP Gateway Configuration
app:
  sms:
    provider: ${SMS_PROVIDER:CONSOLE} # FAST2SMS, TWILIO, or CONSOLE
    fast2sms:
      api-key: ${FAST2SMS_API_KEY:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  company:
    name: "Apex Global Technologies Inc."
    email: "admin@apextech.com"
    phone: "+1 (800) 555-0199"
    address: "100 Tech Park Boulevard, Suite 500, Silicon City, CA"
