plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.smartbiometric'
    compileSdk 34

    defaultConfig {
        applicationId "com.company.smartbiometric"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0-poco-kiosk"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Android BiometricPrompt (POCO M2 Pro side-mounted fingerprint sensor)
    implementation 'androidx.biometric:biometric:1.1.0'

    // CameraX for Front-Camera Face Verification & Enrollment
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google ML Kit On-Device Face Detection (Landmarks, Contours, Blink & Head-Turn Liveness)
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // Retrofit + OkHttp + Gson for Spring Boot REST API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
