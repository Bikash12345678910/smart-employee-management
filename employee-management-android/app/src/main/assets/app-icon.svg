<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald-Cyan Primary Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Neon Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Shield Shape in Background -->
  <path d="M256 90 L370 145 C370 275 256 365 256 365 C256 365 142 275 142 145 Z" 
        fill="url(#shieldGrad)" stroke="url(#neonGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Biometric Scanner Grid & Arcs (Fingerprint / Face Fusion) -->
  <!-- Arc 1 -->
  <path d="M210 200 C210 170 230 150 256 150 C282 150 302 170 302 200" 
        fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" />

  <!-- Arc 2 -->
  <path d="M195 230 C195 180 220 170 256 170 C292 170 317 180 317 230 C317 255 310 275 300 295" 
        fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" />

  <!-- Arc 3 -->
  <path d="M182 265 C182 220 205 190 256 190 C307 190 330 220 330 265 C330 305 310 335 285 355" 
        fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />

  <!-- Arc 4 (Center Core) -->
  <path d="M236 235 C236 220 244 212 256 212 C268 212 276 220 276 235 C276 265 260 280 260 305" 
        fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" />

  <!-- Center Verification Pulse Node -->
  <circle cx="256" cy="240" r="10" fill="#10b981" filter="url(#glow)" />

  <!-- Corner Biometric Target Brackets (Face Biometric Framing) -->
  <!-- Top-Left -->
  <path d="M120 160 L120 120 L160 120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right -->
  <path d="M352 120 L392 120 L392 160" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left -->
  <path d="M120 352 L120 392 L160 392" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right -->
  <path d="M352 392 L392 392 L392 352" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Verified Check / Smart Dot Badge (Bottom Right) -->
  <circle cx="380" cy="380" r="48" fill="#0f172a" stroke="#10b981" stroke-width="5" />
  <circle cx="380" cy="380" r="38" fill="#10b981" />
  <path d="M366 380 L376 390 L396 370" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
