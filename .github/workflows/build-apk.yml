name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build React Frontend
        run: |
          cd employee-management-frontend
          npm install
          npm run build
          mkdir -p ../employee-management-android/app/src/main/assets
          cp -r dist/* ../employee-management-android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: |
          cd employee-management-android
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/smart-biometric-attendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-biometric-attendance-apk
          path: employee-management-android/app/build/outputs/apk/debug/smart-biometric-attendance.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Smart Biometric POCO M2 Pro Kiosk APK v2.0.0"
          body: |
            ### 📱 Smart Fingerprint & Face Shared Attendance Terminal (POCO M2 Pro)
            - **1-Tap Check-In / 4-Quick-Taps Check-Out** with configurable tap timeout
            - **Android BiometricPrompt** (device-level fingerprint confirmation) + **CameraX Front-Camera 1:1 Face Verification & Blink/Head-Turn Liveness**
            - **AES-256-GCM Encrypted Face Templates**, Biometric Consent, Replay Protection & Server-Side Timestamps
          files: employee-management-android/app/build/outputs/apk/debug/smart-biometric-attendance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
